[project]
name = "authless"
version = "0.2.0"
description = "A Zen OAuth2 helper for requests"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Florin Ciurcanu", email = "florin.ciurcanu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests==2.*",
]

[project.scripts]
authless = "authless.main:main"

[build-system]
requires = ["uv_build==0.*"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

